{% extends "base.html" %}

{% block content %}
  <main class="page-wrapper">

    <h1 style="margin-bottom: 1rem">Races List</h1>

    <section class="filter-bar" aria-label="Filters">

      <div class="filter-group">
        <input type="text" id="filter-search" placeholder="Filter by name, system, type..." aria-label="Search races" style="min-width:240px">
      </div>

      <div class="filter-group" style="justify-content:flex-end">
        <label class="filter-toggle">
          <input type="checkbox" id="filter-hide-dw3">
          Hide DW3 races
        </label>
        <label class="filter-toggle">
          <input type="checkbox" id="filter-hide-horizons">
          Hide Horizons races
        </label>
        {% if favourites_enabled %}
        <label class="filter-toggle" id="filter-hide-ignored-group" style="display:none">
          <input type="checkbox" id="filter-hide-ignored">
          Hide 💔 races
        </label>
        {% endif %}
        <label class="filter-toggle">
          <input type="checkbox" id="filter-daytime-only">
          Only Daylight
        </label>
      </div>

      <div class="filter-group">
        <label for="sort-select" style="white-space:nowrap">Sort by</label>
        <select id="sort-select">
          <option value="activity">Recent activity</option>
          <option value="name">Name</option>
          <option value="created">Date added</option>
        </select>
      </div>

    </section>

    <section id="rival-panel" class="filter-bar" aria-label="Rivalry filter" style="margin-top: 0.5rem">
      <div class="filter-group">
        <label for="rival-input" style="margin-right: 0.5rem; white-space: nowrap;">⚔️ Rival CMDR:</label>
        <div class="nendy-autocomplete">
          <input type="text" id="rival-input" class="nendy-input" placeholder="Commander name..."
                 aria-label="Rival commander" autocomplete="off" spellcheck="false" style="min-width:240px">
          <ul class="nendy-suggestions" id="rival-suggestions" hidden></ul>
        </div>
        <button id="rival-apply-btn" class="btn-chip">Filter</button>
        <button id="rival-clear-btn" class="btn-chip" style="display:none">✕ Clear</button>
        <span class="muted" style="font-size:0.85rem">Use this filter to only show races where this CMDR is ahead of you</span>
      </div>
    </section>

    <section class="filter-bar" aria-label="Current System" style="margin-top: 0.5rem">
      <div class="filter-group">
        <label for="current-system" style="margin-right: 0.5rem; white-space: nowrap;">Your current system:</label>
        <div class="nendy-autocomplete">
          <input type="text" id="current-system" class="nendy-input" placeholder="e.g. Deciat"
                 aria-label="Current system" autocomplete="off" spellcheck="false" style="min-width:360px">
          <ul class="nendy-suggestions" id="system-suggestions" hidden></ul>
        </div>
        <button id="find-system-btn" class="btn-chip">Find</button>
      </div>
    </section>

    <div class="status-bar">
      <span id="race-count" style="font-weight: bold; color: var(--text)"></span>
    </div>

    <div id="races-table-container">
      <p class="loading-placeholder">Loading time trials…</p>
    </div>

  </main>
{% endblock %}

{% block extra_scripts %}
  <script>window.FEATURE_FLAGS = { favourites: {{ favourites_flag | tojson }}, favourites_for: {{ favourites_enabled_for | tojson }} };</script>
  <script type="module" src="/static/js/races-table.js?v={{ v }}"></script>
{% endblock %}
